[package]
name = "yurherdr-native-ui-probe"
version = "0.0.0"
edition = "2024"
rust-version = "1.100.0"
publish = false
description = "Guarded, experimental YUR-005 native UI evaluation; not a product client"

[features]
default = []
native = ["dep:gpui-kit"]
ui-tests = ["native", "gpui-kit/test-support"]

[dependencies]
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "e97fe438129c5e4ccab504f2e6fafd9a4e396bba", optional = true, default-features = false, features = ["component", "assets", "x11"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
libc = "=0.2.189"
portable-pty = "=0.9.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
vt100 = "=0.16.2"

[target.'cfg(target_os = "linux")'.dependencies]
wl-clipboard-rs = "=0.9.4"

[profile.dev]
debug = 0

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
